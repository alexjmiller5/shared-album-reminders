[project]
name = "shared-album-reminders"
version = "0.1.0"
description = "Daily reminders to copy shared photo albums into the photo library"
requires-python = ">=3.12"
dependencies = [
    "soma",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
soma = { git = "https://github.com/alexjmiller5/soma", rev = "a2bcf448391cdaa54d668d92a42f6a9272a6cf25" }
