[project]
name = "shared-album-reminders"
version = "0.1.0"
description = "Daily reminders to copy shared photo albums into the photo library"
requires-python = ">=3.12"
dependencies = [
    "life-data",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
life-data = { git = "https://github.com/alexjmiller5/life-data", rev = "22daeac57fd9a821d70fba468daa8a081b7d98c3" }
